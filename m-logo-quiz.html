<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW Logo Master Quiz - SSCEC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a365d; --accent: #d4af37; --success: #22c55e; --error: #ef4444;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 850px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .quiz-header { background: var(--primary); color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .timer-box { font-size: 1.5rem; background: rgba(0,0,0,0.2); display: inline-block; padding: 5px 20px; border-radius: 50px; margin-top: 10px; border: 2px solid var(--accent); }

        .study-grid { padding: 20px; }
        .qa-card { border-left: 5px solid var(--accent); background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 1.1rem; margin-bottom: 8px; }

        .quiz-section { padding: 20px; background: #fff; }
        .q-card { background: #f8fafc; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 2px solid #e2e8f0; }
        .options { display: grid; gap: 10px; margin-top: 15px; }
        .option { padding: 15px; border: 2px solid #cbd5e1; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 1.1rem; background: white; }
        
        .correct { background: var(--success) !important; color: white; border-color: #166534; box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4); }
        .wrong { background: var(--error) !important; color: white; border-color: #991b1b; }

        .result-box { display: none; text-align: center; padding: 40px 20px; background: white; }
        .final-score { font-size: 3.5rem; color: var(--primary); font-weight: 800; margin: 10px 0; }
        
        .btn { padding: 15px 30px; border-radius: 10px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin: 10px; transition: 0.3s; text-decoration: none; display: inline-block; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-retry { background: var(--accent); color: white; }
        .start-btn { background: var(--primary); color: white; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<audio id="correctSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<div class="container">
    <div class="quiz-header">
        <h2 style="margin:0"><i class="fas fa-turtle"></i> MSW Logo মাস্টার কুইজ</h2>
	<p>Super Success Computer Education Center (SSCEC) – নতুন যুগের দিশারি</p>
        <div class="timer-box" id="timerDisplay" style="display:none"><i class="fas fa-clock"></i> <span id="timer">00:00</span></div>
    </div>

    <div id="studyArea" class="study-grid">
        <h3 style="text-align:center; color: var(--primary); margin-top:0">আগে এই ১৫টি প্রশ্ন পড়ে নাও</h3>
        <div id="qaList"></div>
        <button class="btn start-btn" onclick="startQuiz()">সব পড়া শেষ, মক টেস্ট শুরু করো!</button>
    </div>

    <div id="quizArea" class="quiz-section" style="display:none">
        <div id="questionContainer"></div>
    </div>

    <div id="resultArea" class="result-box">
        <i class="fas fa-trophy" style="font-size: 80px; color: var(--accent);"></i>
        <h1>খুব ভালো খেলেছ!</h1>
        <div class="final-score"><span id="totalPoints">0</span>/15</div>
        <p style="font-size:1.2rem">সময় লেগেছে: <span id="timeTaken">0</span></p>
        
        <a id="waBtn" href="#" target="_blank" class="btn btn-whatsapp">
            <i class="fab fa-whatsapp"></i> স্যারকে জানাও (Send Report)
        </a>
        <br>
        <button class="btn btn-retry" onclick="location.reload()">আবার চেষ্টা করো</button>
    </div>
</div>

<script>
    const teacherPhone = "91XXXXXXXXXX"; // স্যার আপনার নম্বরটি এখানে বসান (উদা: 919876543210)
    
    // ১৫টি প্রশ্ন ও উত্তরের ডাটাবেস
    const logoData = [
        { q: "MSW Logo-র পুরো নাম কী?", o: ["Logic Oriented Graphic Oriented", "Logic Online Graphic", "Logic Object Graphic"], c: "Logic Oriented Graphic Oriented" },
        { q: "টারটেলকে সামনে এগিয়ে নেওয়ার কমান্ড কী?", o: ["BK", "FD", "RT"], c: "FD" },
        { q: "স্ক্রিন পরিষ্কার করার কমান্ড কোনটি?", o: ["CT", "CS", "ST"], c: "CS" },
        { q: "টারটেল লুকানোর কমান্ড কোনটি?", o: ["HT", "ST", "PU"], c: "HT" },
        { q: "টারটেলকে ডানে ৯০ ডিগ্রি ঘোরাতে কমান্ড কী?", o: ["RT 90", "LT 90", "FD 90"], c: "RT 90" },
        { q: "পেন তুলে রাখার কমান্ড (যাতে দাগ না পড়ে)?", o: ["PD", "PU", "PE"], c: "PU" },
        { q: "পেন পুনরায় নামানোর কমান্ড কোনটি?", o: ["PU", "PD", "HOME"], c: "PD" },
        { q: "লোগো থেকে বেরিয়ে আসার কমান্ড কী?", o: ["BYE", "EXIT", "STOP"], c: "BYE" },
        { q: "টারটেলকে শুরুতে (Home) ফিরিয়ে আনতে কী লাগে?", o: ["START", "HOME", "CS"], c: "HOME" },
        { q: "লুকানো টারটেল দেখার কমান্ড কোনটি?", o: ["ST", "HT", "CS"], c: "ST" },
        { q: "কমান্ড উইন্ডোর টেক্সট মোছার কমান্ড কী?", o: ["CS", "CT", "BYE"], c: "CT" },
        { q: "টারটেলকে পেছনে নেওয়ার কমান্ড কোনটি?", o: ["FD", "BK", "LT"], c: "BK" },
        { q: "বর্গক্ষেত্র (Square) আঁকতে কতবার REPEAT করতে হয়?", o: ["3", "4", "360"], c: "4" },
        { q: "টারটেলকে বামে ঘুরানোর কমান্ড কী?", o: ["RT", "LT", "FD"], c: "LT" },
        { q: "পেন ইরেজার (মুছে ফেলা) করার কমান্ড কোনটি?", o: ["PE", "PD", "PU"], c: "PE" }
    ];

    let timerInterval, seconds = 0, score = 0, answered = 0;

    // পড়ার লিস্ট তৈরি করা
    const qaList = document.getElementById('qaList');
    logoData.forEach((item, i) => {
        qaList.innerHTML += `<div class="qa-card"><b>${i+1}. ${item.q}</b> <br> উত্তর: ${item.c}</div>`;
    });

    function startQuiz() {
        document.getElementById('studyArea').style.display = 'none';
        document.getElementById('timerDisplay').style.display = 'inline-block';
        document.getElementById('quizArea').style.display = 'block';
        startTimer();
        loadQuestions();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            document.getElementById('timer').innerText = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        }, 1000);
    }

    function loadQuestions() {
        const container = document.getElementById('questionContainer');
        logoData.forEach((iq, index) => {
            let optionsHtml = iq.o.map(opt => `<div class="option" onclick="checkAnswer(this, '${opt}', '${iq.c}')">${opt}</div>`).join('');
            container.innerHTML += `<div class="q-card"><h3>${index + 1}. ${iq.q}</h3><div class="options">${optionsHtml}</div></div>`;
        });
    }

    function checkAnswer(el, selected, correct) {
        if (el.parentElement.classList.contains('locked')) return;
        el.parentElement.classList.add('locked');
        answered++;
        if (selected === correct) {
            score++; el.classList.add('correct');
            document.getElementById('correctSound').play();
        } else {
            el.classList.add('wrong');
            document.getElementById('wrongSound').play();
        }
        if (answered === logoData.length) finishQuiz();
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        setTimeout(() => {
            document.getElementById('quizArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('totalPoints').innerText = score;
            let finalTime = document.getElementById('timer').innerText;
            document.getElementById('timeTaken').innerText = finalTime;
            
            let msg = `স্যার, আমি লোগো মাস্টার কুইজ সম্পন্ন করেছি।%0Aস্কোর: ${score}/15%0Aসময় লেগেছে: ${finalTime}%0Aনাম: `;
            document.getElementById('waBtn').href = `https://wa.me/${teacherPhone}?text=${msg}`;
        }, 1000);
    }
</script>
</body>
</html>
